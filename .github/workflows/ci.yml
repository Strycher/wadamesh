name: CI

# Build-checks every PR to main (and main itself) across all firmware envs.
# Mirrors the release.yml build recipe (setup-python 3.12 + PlatformIO + cache).
# No secrets required: scripts/inject_wifi_env.py falls back to placeholder
# credentials when WIFI_SSID/WIFI_PWD are unset.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Guard: inert if this file ever rides an upstream-bound branch.
    if: github.repository == 'Strycher/wadamesh'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pio_env:
          - heltec_v4_tft_companion_radio_usb_tcp_touch
          - heltec_v4_r8_tft_companion_radio_usb_tcp_touch
          - LilyGo_TDeck_companion_radio_touch
          - ThinkNode_M9_companion_radio_touch
          - rak_tap_v2_companion_radio_touch
          # ESP32-P4, pioarduino hybrid (arduino as an IDF component). Slower and
          # heavier than the S3 envs: it pulls its own platform, IDF 5.5 and a
          # ~900 MB riscv32 toolchain, none of which the other envs share. Added
          # here so regressions show up, but deliberately NOT a required status
          # check on main until it has proven itself over a few runs — a required
          # context that never reports blocks every PR forever (#79).
          - crowpanel7_companion_radio_touch
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags. scripts/inject_version.py derives the version from a
          # commit count and from `git describe --match beta_*`, and both are wrong on
          # the fetch-depth-1 clone this action gives by default. The script will
          # deepen a shallow clone itself, but doing it here is one fetch at checkout
          # instead of one per env mid-build.
          fetch-depth: 0
          # fetch-depth 0 alone was not enough (#92): a run arrived with beta_44 as
          # the newest tag present and stamped beta_44+ob.871, where the same commit
          # gives beta_85+ob.11 locally. Ask for tags explicitly.
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-ci-${{ runner.os }}-${{ matrix.pio_env }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        # PINNED, not --upgrade (#93). An unpinned core is what broke the crowpanel7
        # env: the newest core requires `tool-scons ~4.41101.0` and installs it over
        # the 4.8.1 that pioarduino's platform pins, and SCons 4.11 removed
        # SCons.Tool.FortranCommon, which the espidf builder imports. The job
        # compiled the whole tree and then died at link with ModuleNotFoundError.
        #
        # 6.1.19 is the version the boards are actually developed against, so this
        # makes CI reproduce the developer machine instead of drifting ahead of it.
        # Bump it deliberately, with a green matrix, never incidentally.
        run: pip install platformio==6.1.19

      - name: Build ${{ matrix.pio_env }}
        run: pio run -e ${{ matrix.pio_env }}
