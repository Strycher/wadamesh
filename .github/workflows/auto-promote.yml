# Auto-promote dependencies: when an issue closes, check if blocked
# issues now have all dependencies resolved and label them board:ready.
#
# Trigger: issue closed + 4-hour cron fallback sweep
# API: REST only (no GraphQL / gh project)
name: Auto-promote Dependencies

on:
  issues:
    types: [closed]
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours (fallback sweep)
  workflow_dispatch:

permissions:
  issues: write

jobs:
  promote:
    runs-on: ubuntu-latest
    if: github.repository == 'Strycher/wadamesh'
    steps:
      - name: Find and promote unblocked issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Fetch all open issues
            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 }
            );

            // Fetch all closed issues (for dependency checking)
            const closedIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'closed', per_page: 100 }
            );

            const closedNumbers = new Set(
              closedIssues.map(i => i.number)
            );

            // Parse depends-on from issue body
            function getDeps(body) {
              if (!body) return [];
              const match = body.match(
                /<!--\s*depends-on:\s*(.*?)\s*-->/i
              );
              if (!match) return [];
              return match[1]
                .split(',')
                .map(s => s.trim())
                .filter(s => s.startsWith('#'))
                .map(s => parseInt(s.slice(1), 10))
                .filter(n => !isNaN(n));
            }

            let promoted = 0;

            for (const issue of openIssues) {
              // Skip PRs
              if (issue.pull_request) continue;

              const deps = getDeps(issue.body);
              if (deps.length === 0) continue;

              const allResolved = deps.every(d => closedNumbers.has(d));
              const labels = issue.labels.map(l => l.name);
              const hasReady = labels.includes('board:ready');

              if (allResolved && !hasReady) {
                // Promote: Todo -> Ready (sync-labels-to-board.yml moves the board)
                await github.rest.issues.addLabels({
                  owner, repo,
                  issue_number: issue.number,
                  labels: ['board:ready'],
                });

                // Add comment
                const depList = deps.map(d => `#${d}`).join(', ');
                await github.rest.issues.createComment({
                  owner, repo,
                  issue_number: issue.number,
                  body: `All dependencies resolved (${depList}). This issue is now ready for work.`,
                });

                console.log(`Promoted #${issue.number}: ${issue.title}`);
                promoted++;
              }
            }

            console.log(`\nPromoted ${promoted} issue(s)`);
